services:
  db-postgres:
    image: postgres:18.1-bookworm
    container_name: task_flow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: task_flow
    ports:
      - "5432:5432"
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql   
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_flow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: task_flow_pgweb
    restart: unless-stopped
    ports:
      - "8081:8081"
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      PGWEB_DATABASE_URL: postgres://postgres:root@db-postgres:5432/task_flow?sslmode=disable
    depends_on:
      db-postgres:
        condition: service_healthy   

  redis:
    image: redis:latest
    container_name: task_flow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    mem_limit: 512m
    mem_reservation: 256m
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
      
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: task_flow_redis_commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379:0:redis_password"
    depends_on:
      - redis


volumes:
  pgdata:
  redis_data: 